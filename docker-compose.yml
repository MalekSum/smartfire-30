services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ['1883:1883', '8883:8883']
    volumes:
      - ./fog/mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

  nodered:
    build: ./fog/nodered
    ports: ['1880:1880']
    volumes: ['nodered_data:/data']
    depends_on: [mosquitto]

  fog:
    build: {context: ., dockerfile: fog/Dockerfile}
    env_file: .env
    depends_on: [mosquitto, cloud]
    restart: unless-stopped

  cloud:
    build: {context: ., dockerfile: cloud/Dockerfile}
    env_file: .env
    ports: ['8000:8000']
    volumes: ['./models:/models', 'cloud_data:/data']
    restart: unless-stopped

volumes:
  mosquitto_data:
  nodered_data:
  cloud_data:
